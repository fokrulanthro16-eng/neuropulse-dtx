<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A1208" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090A0F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="1"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep OLED Canvas -->
  <rect width="1200" height="420" fill="url(#bgGlow)"/>
  
  <!-- Subtle Grid System -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Central Amber 590nm Waveform Visualizer -->
  <path d="M 50 210 Q 150 210 250 210 T 350 200 T 420 230 T 480 160 T 520 270 T 560 120 T 600 300 T 640 100 T 680 310 T 720 140 T 760 260 T 820 180 T 880 215 T 980 210 T 1150 210" 
        fill="none" stroke="url(#waveGlow)" stroke-width="4" filter="url(#glowFilter)" stroke-linecap="round"/>

  <!-- Brand Emblem Top Left -->
  <g transform="translate(80, 50)">
    <rect width="48" height="48" rx="14" fill="#181510" stroke="#F59E0B" stroke-width="1.5" opacity="0.9"/>
    <circle cx="24" cy="24" r="7" fill="#F59E0B" filter="url(#glowFilter)"/>
    <circle cx="24" cy="24" r="3" fill="#FFFBEB"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="145" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    NEUROPULSE <tspan fill="#F59E0B">DTx</tspan>
  </text>
  <text x="146" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#A1A1AA" letter-spacing="1.5">
    SOFTWARE-AS-A-MEDICAL-DEVICE (SaMD v3)
  </text>

  <!-- Main Headline -->
  <text x="80" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#F4F4F5" letter-spacing="-1">
    Precision Digital Therapeutics for Concussion Recovery
  </text>
  
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#A1A1AA" max-width="800">
    Zero-Photophobia Architecture • Acoustic Voice DSP • On-Device VOMS • BESS 3D Sway Radar • HL7 FHIR R4
  </text>

  <!-- Clinical Protocol Badges Pill Strip -->
  <g transform="translate(80, 315)">
    <!-- SCAT6 Badge -->
    <rect x="0" y="0" width="135" height="42" rx="21" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#10B981"/>
    <text x="36" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFFFFF">SCAT6 Protocol</text>

    <!-- PCSS Matrix -->
    <rect x="148" y="0" width="145" height="42" rx="21" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="170" cy="21" r="5" fill="#38BDF8"/>
    <text x="184" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFFFFF">22-Vector PCSS</text>

    <!-- VOMS Eye Tracking -->
    <rect x="306" y="0" width="140" height="42" rx="21" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="328" cy="21" r="5" fill="#F59E0B"/>
    <text x="342" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFFFFF">VOMS Vision</text>

    <!-- BESS Balance -->
    <rect x="459" y="0" width="135" height="42" rx="21" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="481" cy="21" r="5" fill="#A855F7"/>
    <text x="495" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFFFFF">BESS 3D Sway</text>

    <!-- HL7 FHIR R4 -->
    <rect x="607" y="0" width="145" height="42" rx="21" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="629" cy="21" r="5" fill="#EC4899"/>
    <text x="643" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFFFFF">HL7 FHIR R4</text>

    <!-- ECDSA P-256 -->
    <rect x="765" y="0" width="150" height="42" rx="21" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="787" cy="21" r="5" fill="#F59E0B"/>
    <text x="801" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFFFFF">ECDSA Clearance</text>
  </g>

  <!-- Right Floating Metric Widget -->
  <g transform="translate(970, 45)">
    <rect width="150" height="90" rx="16" fill="#12131A" stroke="#F59E0B" stroke-width="1.2" opacity="0.95"/>
    <text x="20" y="28" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#A1A1AA" letter-spacing="1">SPECTRUM</text>
    <text x="20" y="58" font-family="ui-monospace, monospace" font-size="22" font-weight="800" fill="#F59E0B">590 nm</text>
    <text x="20" y="76" font-family="-apple-system, sans-serif" font-size="10" fill="#10B981">0% Blue Light Ocular</text>
  </g>
</svg>
