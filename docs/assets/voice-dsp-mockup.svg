<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1F170B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0C0D14" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="amberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FCD34D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadowGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="360" rx="24" fill="url(#cardGlow)" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(35, 35)">
    <circle cx="10" cy="10" r="5" fill="#F59E0B"/>
    <text x="24" y="14" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      Acoustic Voice Biomarker DSP Pipeline
    </text>
    <text x="24" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#A1A1AA">
      Sampling: 48.0 kHz • Analyser FFT: 2048 • Cognitive Hesitation Extraction
    </text>
  </g>

  <!-- Waveform Canvas Box -->
  <rect x="35" y="85" width="730" height="130" rx="16" fill="#06070A" stroke="#1F2028" stroke-width="1"/>

  <!-- Waveform Grid Lines -->
  <line x1="35" y1="150" x2="765" y2="150" stroke="#27272A" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="220" y1="85" x2="220" y2="215" stroke="#1F2028" stroke-width="1"/>
  <line x1="420" y1="85" x2="420" y2="215" stroke="#1F2028" stroke-width="1"/>
  <line x1="580" y1="85" x2="580" y2="215" stroke="#1F2028" stroke-width="1"/>

  <!-- Acoustic Voice Signal -->
  <path d="M 45 150 Q 80 150 110 150 Q 130 110 150 185 Q 170 120 190 170 Q 210 150 230 150 L 320 150 Q 340 100 360 200 Q 380 130 400 165 Q 415 150 430 150 L 510 150 Q 530 115 550 180 Q 570 135 590 160 Q 610 150 630 150 L 755 150" 
        fill="none" stroke="url(#amberLine)" stroke-width="3" filter="url(#shadowGlow)"/>

  <!-- Pause Annotations -->
  <rect x="230" y="100" width="90" height="24" rx="6" fill="#181510" stroke="#F59E0B" stroke-width="1"/>
  <text x="240" y="116" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#F59E0B">Pause: 0.62s</text>

  <rect x="430" y="100" width="80" height="24" rx="6" fill="#181510" stroke="#F59E0B" stroke-width="1"/>
  <text x="440" y="116" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#F59E0B">Pause: 0.44s</text>

  <!-- 3 Metric Readout Cards -->
  <g transform="translate(35, 235)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="230" height="90" rx="16" fill="#12131A" stroke="#27272A" stroke-width="1"/>
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">Speech Pause Ratio</text>
    <text x="18" y="60" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#F59E0B">28.4%</text>
    <text x="18" y="78" font-family="ui-monospace, monospace" font-size="10" fill="#10B981">↓ 14% vs Acute Day 1</text>

    <!-- Metric 2 -->
    <rect x="250" y="0" width="230" height="90" rx="16" fill="#12131A" stroke="#27272A" stroke-width="1"/>
    <text x="268" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">Vocal RMS Energy</text>
    <text x="268" y="60" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#38BDF8">0.048 dB</text>
    <text x="268" y="78" font-family="ui-monospace, monospace" font-size="10" fill="#A1A1AA">Stable amplitude jitter</text>

    <!-- Metric 3 -->
    <rect x="500" y="0" width="230" height="90" rx="16" fill="#12131A" stroke="#27272A" stroke-width="1"/>
    <text x="518" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA">Cognitive Fatigue Index</text>
    <text x="518" y="60" font-family="ui-monospace, monospace" font-size="24" font-weight="800" fill="#10B981">31 / 100</text>
    <text x="518" y="78" font-family="ui-monospace, monospace" font-size="10" fill="#10B981">Sub-Threshold Safe Range</text>
  </g>
</svg>
