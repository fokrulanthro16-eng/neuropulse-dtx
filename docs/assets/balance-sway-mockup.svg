<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bessBg" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#191322" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09070D" stop-opacity="0.98"/>
    </radialGradient>
    <filter id="purpleGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="24" fill="url(#bessBg)" stroke="#27272A" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(35, 35)">
    <circle cx="10" cy="10" r="5" fill="#A855F7"/>
    <text x="24" y="14" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      BESS Postural Sway 3D Accelerometer Radar
    </text>
    <text x="24" y="32" font-family="ui-monospace, monospace" font-size="11" fill="#A1A1AA">
      SCAT6 Balance Error Scoring System • Tri-Axial Accelerometer Sway Telemetry
    </text>
  </g>

  <!-- 3D Radar Circle Arena -->
  <g transform="translate(35, 80)">
    <rect width="480" height="245" rx="16" fill="#050408" stroke="#1F2028" stroke-width="1"/>
    
    <!-- Radar Rings (5 deg, 10 deg, 15 deg threshold) -->
    <circle cx="240" cy="122" r="35" fill="none" stroke="#2D223B" stroke-width="1"/>
    <text x="245" y="93" font-family="ui-monospace, monospace" font-size="9" fill="#71717A">5°</text>

    <circle cx="240" cy="122" r="70" fill="none" stroke="#2D223B" stroke-width="1"/>
    <text x="245" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#71717A">10°</text>

    <circle cx="240" cy="122" r="105" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="245" y="23" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#F59E0B">15° LIMIT CONE</text>

    <!-- Radar Crosshairs -->
    <line x1="240" y1="12" x2="240" y2="232" stroke="#1C1824" stroke-width="1"/>
    <line x1="130" y1="122" x2="350" y2="122" stroke="#1C1824" stroke-width="1"/>

    <!-- Postural Sway Trajectory Path (Purple) -->
    <path d="M 240 122 Q 248 110 255 118 Q 262 135 250 140 Q 235 145 228 132 Q 220 120 232 110 Q 245 105 258 112 Q 268 128 252 136 Z" 
          fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="2" filter="url(#purpleGlow)"/>

    <!-- Current Position Marker -->
    <circle cx="252" cy="136" r="7" fill="#F59E0B"/>
    <circle cx="252" cy="136" r="2.5" fill="#FFFFFF"/>

    <!-- 20s Trial Pill -->
    <rect x="20" y="205" width="150" height="24" rx="12" fill="#12131A" stroke="#27272A" stroke-width="1"/>
    <circle cx="32" cy="217" r="3.5" fill="#10B981"/>
    <text x="42" y="221" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#FFFFFF">SINGLE LEG FIRM (20s)</text>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(535, 80)">
    <!-- Card 1: Sway Area -->
    <rect x="0" y="0" width="230" height="74" rx="14" fill="#12131A" stroke="#27272A" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">Postural Sway Area</text>
    <text x="16" y="52" font-family="ui-monospace, monospace" font-size="22" font-weight="800" fill="#A855F7">680 mm²/s</text>
    <text x="140" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#10B981">&lt;1200 Normal</text>

    <!-- Card 2: BESS Errors -->
    <rect x="0" y="85" width="230" height="74" rx="14" fill="#12131A" stroke="#27272A" stroke-width="1"/>
    <text x="16" y="109" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">Trial Error Count</text>
    <text x="16" y="137" font-family="ui-monospace, monospace" font-size="22" font-weight="800" fill="#10B981">2 / 10</text>
    <text x="120" y="137" font-family="ui-monospace, monospace" font-size="10" fill="#10B981">Minimal Sway</text>

    <!-- Card 3: RMS Acceleration -->
    <rect x="0" y="170" width="230" height="75" rx="14" fill="#12131A" stroke="#27272A" stroke-width="1"/>
    <text x="16" y="194" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA">RMS Accel Stability</text>
    <text x="16" y="222" font-family="ui-monospace, monospace" font-size="22" font-weight="800" fill="#F59E0B">0.34 m/s²</text>
    <text x="140" y="222" font-family="ui-monospace, monospace" font-size="10" fill="#10B981">Firm Balance</text>
  </g>
</svg>
